name: Bug report
description: Something in the game or the builds doesn't work as expected.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Thanks for reporting! Please check existing issues first.
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Web (desktop browser)
        - Web (mobile browser)
        - Android app
        - Server / self-hosting
        - Build / CI
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Shown at the bottom of the main menu, or the release name.
      placeholder: "0.4.1"
  - type: input
    id: environment
    attributes:
      label: Browser / OS / device
      placeholder: "Chrome 141 on Windows 11, Pixel 7 with Android 16…"
  - type: dropdown
    id: mode
    attributes:
      label: Game mode
      options:
        - Play vs bot (offline)
        - Online match
        - Not in a game (menu, settings…)
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Start "Play vs bot"
        2. Buy a tile …
        3. …
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Browser console errors, server logs, or a screenshot.
      render: text
