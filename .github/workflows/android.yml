name: Build & Release

# Every push to main/master:  type-check -> web build -> Android build -> new version tag + GitHub Release (APK/AAB + web zip).
#   version: next patch after the latest v* tag. Put [minor] or [major] in the commit message to bump those instead.
#   build:   signed release (APK + AAB) when the keystore secrets exist, otherwise a debug APK (published as a pre-release).
# Pull requests: debug APK only (no release, no tag).  Manual run: choose build type / bump / whether to publish.

on:
  push:
    branches: [main, master]
    tags: ['v*']
    paths-ignore: ['**.md', 'docs/**', '.gitignore', '.gitattributes']
  pull_request:
    paths: ['client/**', 'shared/**', 'package.json', 'package-lock.json', '.github/**']
  workflow_dispatch:
    inputs:
      build:
        description: 'What to build'
        type: choice
        default: auto
        options: [auto, debug-apk, release-apk, release-aab]
      bump:
        description: 'Version bump'
        type: choice
        default: patch
        options: [patch, minor, major]
      release:
        description: 'Create a tag + GitHub Release'
        type: boolean
        default: true

permissions:
  contents: write   # create the version tag and the release

# Release runs are queued (never cancelled halfway); only PR builds are cancelled by newer commits.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.ref) || 'release' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # we need the tags to compute the next version

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Decide version and build type
        id: cfg
        run: bash .github/scripts/version.sh
        env:
          EVENT: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          RUN_NUMBER: ${{ github.run_number }}
          PR_NUMBER: ${{ github.event.number }}
          INPUT_BUMP: ${{ github.event.inputs.bump }}
          INPUT_BUILD: ${{ github.event.inputs.build }}
          INPUT_RELEASE: ${{ github.event.inputs.release }}
          HAS_KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}

      - name: Show plan
        run: echo "::notice title=Grid Rush v${{ steps.cfg.outputs.version }}::build=${{ steps.cfg.outputs.build }} bump=${{ steps.cfg.outputs.bump }} publish=${{ steps.cfg.outputs.publish }}"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci

      - name: Stamp version into the workspace packages
        run: |
          node -e "const fs=require('fs');for(const f of ['package.json','client/package.json','server/package.json']){const j=JSON.parse(fs.readFileSync(f,'utf8'));j.version=process.env.V;fs.writeFileSync(f,JSON.stringify(j,null,2)+'\n')}"
        env:
          V: ${{ steps.cfg.outputs.version }}

      - name: Type check
        run: npm run typecheck

      - name: Build web client
        run: npm run build -w client
        env:
          VITE_APP_VERSION: ${{ steps.cfg.outputs.version }}
          # Optional repository variable (Settings > Secrets and variables > Actions > Variables), e.g. wss://game.example.com
          VITE_SERVER_URL: ${{ vars.SERVER_URL }}

      - name: Sync Capacitor
        working-directory: client
        run: npx cap sync android

      - name: Set Android version
        working-directory: client/android
        run: |
          sed -i "s/versionCode 1/versionCode ${{ github.run_number }}/" app/build.gradle
          sed -i "s/versionName \"1.0\"/versionName \"${{ steps.cfg.outputs.version }}\"/" app/build.gradle
          grep -n "versionCode\|versionName" app/build.gradle

      - name: Prepare signing key
        if: steps.cfg.outputs.signed == 'true'
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build Android
        working-directory: client/android
        env:
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          if [ "${{ steps.cfg.outputs.signed }}" = "true" ]; then
            ./gradlew ${{ steps.cfg.outputs.task }} --no-daemon \
              -Pandroid.injected.signing.store.file="$KEYSTORE_FILE" \
              -Pandroid.injected.signing.store.password="$KS_PASS" \
              -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
              -Pandroid.injected.signing.key.password="$KEY_PASS"
          else
            ./gradlew ${{ steps.cfg.outputs.task }} --no-daemon
          fi

      - name: Collect files
        run: |
          mkdir -p dist-android
          V="${{ steps.cfg.outputs.version }}"
          find client/android/app/build/outputs -type f \( -name '*.apk' -o -name '*.aab' \) | while read -r f; do
            case "$f" in */debug/*) variant=debug ;; *) variant=release ;; esac
            cp "$f" "dist-android/GridRush-${V}-${variant}.${f##*.}"
          done
          (cd client/dist && zip -qr "$GITHUB_WORKSPACE/dist-android/GridRush-web-${V}.zip" .)
          ls -la dist-android

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: GridRush-${{ steps.cfg.outputs.version }}
          path: dist-android/*
          if-no-files-found: error

      - name: Create tag and GitHub Release
        if: steps.cfg.outputs.publish == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.cfg.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Grid Rush v${{ steps.cfg.outputs.version }}
          generate_release_notes: true
          prerelease: ${{ steps.cfg.outputs.signed != 'true' }}
          files: dist-android/*
