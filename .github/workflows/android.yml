name: Android build

# Builds the Grid Rush web client and wraps it into an Android app with Capacitor.
#  - Pull requests / manual "debug-apk": installable debug APK (no secrets needed)
#  - Tags "v*" or manual "release-apk" / "release-aab": signed release (needs the signing secrets, see README)

on:
  workflow_dispatch:
    inputs:
      build:
        description: 'What to build'
        type: choice
        default: debug-apk
        options: [debug-apk, release-apk, release-aab]
  push:
    tags: ['v*']
  pull_request:
    paths: ['client/**', 'shared/**', 'package.json', 'package-lock.json', '.github/workflows/android.yml']

permissions:
  contents: write   # needed only to attach files to a GitHub Release on tags

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Decide build type
        id: cfg
        run: |
          BUILD="${{ github.event.inputs.build }}"
          if [ -z "$BUILD" ]; then
            if [ "${{ github.ref_type }}" = "tag" ]; then BUILD="release-aab"; else BUILD="debug-apk"; fi
          fi
          case "$BUILD" in
            debug-apk)   echo "task=assembleDebug"   >> "$GITHUB_OUTPUT"; echo "glob=app/build/outputs/apk/debug/*.apk"      >> "$GITHUB_OUTPUT"; echo "ext=apk" >> "$GITHUB_OUTPUT" ;;
            release-apk) echo "task=assembleRelease" >> "$GITHUB_OUTPUT"; echo "glob=app/build/outputs/apk/release/*.apk"    >> "$GITHUB_OUTPUT"; echo "ext=apk" >> "$GITHUB_OUTPUT" ;;
            release-aab) echo "task=bundleRelease"   >> "$GITHUB_OUTPUT"; echo "glob=app/build/outputs/bundle/release/*.aab" >> "$GITHUB_OUTPUT"; echo "ext=aab" >> "$GITHUB_OUTPUT" ;;
          esac
          echo "build=$BUILD" >> "$GITHUB_OUTPUT"
          if [ "${BUILD#release}" != "$BUILD" ]; then echo "release=true" >> "$GITHUB_OUTPUT"; else echo "release=false" >> "$GITHUB_OUTPUT"; fi
          if [ "${{ github.ref_type }}" = "tag" ]; then V="${GITHUB_REF_NAME#v}"; else V="1.0.${{ github.run_number }}"; fi
          echo "version=$V" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck -w client

      - name: Build web client
        run: npm run build -w client
        env:
          # Optional repository variable (Settings > Secrets and variables > Actions > Variables), e.g. wss://game.example.com
          VITE_SERVER_URL: ${{ vars.SERVER_URL }}

      - name: Sync Capacitor
        working-directory: client
        run: npx cap sync android

      - name: Set version
        working-directory: client/android
        run: |
          sed -i "s/versionCode 1/versionCode ${{ github.run_number }}/" app/build.gradle
          sed -i "s/versionName \"1.0\"/versionName \"${{ steps.cfg.outputs.version }}\"/" app/build.gradle
          grep -n "versionCode\|versionName" app/build.gradle

      - name: Prepare signing key
        if: steps.cfg.outputs.release == 'true'
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::Release builds need the secrets ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS and ANDROID_KEY_PASSWORD (see README)."
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build with Gradle
        working-directory: client/android
        env:
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          if [ "${{ steps.cfg.outputs.release }}" = "true" ]; then
            ./gradlew ${{ steps.cfg.outputs.task }} --no-daemon \
              -Pandroid.injected.signing.store.file="$KEYSTORE_FILE" \
              -Pandroid.injected.signing.store.password="$KS_PASS" \
              -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
              -Pandroid.injected.signing.key.password="$KEY_PASS"
          else
            ./gradlew ${{ steps.cfg.outputs.task }} --no-daemon
          fi

      - name: Collect output
        id: out
        working-directory: client/android
        run: |
          mkdir -p "$GITHUB_WORKSPACE/dist-android"
          NAME="GridRush-${{ steps.cfg.outputs.version }}-${{ steps.cfg.outputs.build }}.${{ steps.cfg.outputs.ext }}"
          cp ${{ steps.cfg.outputs.glob }} "$GITHUB_WORKSPACE/dist-android/$NAME"
          echo "file=dist-android/$NAME" >> "$GITHUB_OUTPUT"
          ls -la "$GITHUB_WORKSPACE/dist-android"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: GridRush-android-${{ steps.cfg.outputs.build }}
          path: ${{ steps.out.outputs.file }}
          if-no-files-found: error

      - name: Attach to GitHub Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.out.outputs.file }}
