# Builds Grid Rush for Android and the web, and publishes a GitHub Release with both: the
# Android app (APK/AAB) and a ready-to-host web build (GridRush-X.Y.Z-Web.zip).
#
# Versions (automatic): every push to main that changes the game is released.
#   The commits since the last release decide the bump (Conventional Commits):
#     "feat!: …" or "BREAKING CHANGE" -> major,  "feat: …" -> minor,
#     "fix:" / "perf:" / "refactor:" / untyped messages -> patch,
#     only "docs:" / "chore:" / "ci:" / "test:" / "style:" / "build:" -> no release (artifacts only).
#   GitHub bumps package.json, commits it ("chore(release): vX.Y.Z [skip ci]"), tags vX.Y.Z and
#   publishes the Release with the final builds and a "What's changed" list.
#   Set a higher version in package.json yourself to choose it; Run workflow can force a bump.
#   Pull requests build X.Y.Z-dev.<run> artifacts only.
# Android versionCode = MAJOR*1000000 + MINOR*1000 + PATCH (always grows with the version).
#
# Repository settings (Settings -> Secrets and variables -> Actions):
#   Variables
#     VITE_SERVER_URL   (optional) public Colyseus endpoint, e.g. wss://game.example.com
#                       Without it the apps play against bots offline and ask for a server address in Settings.
#   Secrets (optional, for a signed Android release APK/AAB)
#     ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD

name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore:
      - "docs/**"
  pull_request:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump (auto = decide from the commit messages)"
        type: choice
        options: [auto, patch, minor, major]
        default: auto

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NODE_VERSION: "22"
  # The game server (repository variable VITE_SERVER_URL; empty = offline bot games only).
  VITE_SERVER_URL: ${{ vars.VITE_SERVER_URL || vars.SERVER_URL || '' }}

jobs:
  # ------------------------------------------------------------------ version
  version:
    name: Version
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.v.outputs.version }}
      release: ${{ steps.v.outputs.release }}
      code: ${{ steps.v.outputs.code }}
      sha: ${{ steps.v.outputs.sha }}
      previous: ${{ steps.v.outputs.previous }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
      - id: v
        env:
          BUMP: ${{ inputs.bump || 'auto' }}
        run: |
          SHA="$GITHUB_SHA"
          newer() { [[ -n "$2" && "$1" != "$2" && "$(printf '%s\n%s\n' "$1" "$2" | sort -V | tail -n 1)" == "$2" ]]; }
          git fetch --quiet --tags origin
          # Highest released version (tags vX.Y.Z): versions only ever go up.
          LATEST=$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' | sed 's/^v//' | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1 || true)
          echo "Latest release: ${LATEST:-none}"
          PREVIOUS="${LATEST:+v$LATEST}"

          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"; RELEASE=true
          elif [[ "$GITHUB_REF" == "refs/heads/main" && "$GITHUB_EVENT_NAME" != "pull_request" ]]; then
            # Work on the newest main (runs are queued; a later push may have landed).
            git fetch --quiet origin main
            git checkout --quiet -B main origin/main
            PKG=$(node -p "require('./package.json').version")
            BASE="$PKG"
            if newer "$PKG" "$LATEST"; then BASE="$LATEST"; fi

            if [[ "$BUMP" == "patch" || "$BUMP" == "minor" || "$BUMP" == "major" ]]; then
              KIND="$BUMP"
            elif newer "$LATEST" "$PKG" || [[ -z "$LATEST" ]]; then
              KIND="chosen"   # package.json was set above the last release by hand (or this is the first release)
            else
              KIND=$(node tools/changes.mjs "$PREVIOUS")
            fi
            echo "Bump: $KIND"

            if [[ "$KIND" == "none" ]]; then
              VERSION="$PKG-dev.$GITHUB_RUN_NUMBER"; RELEASE=false
              echo "::notice::Only docs/chore/ci changes since v$LATEST: no new release. Artifacts are attached to this run."
            elif [[ "$KIND" == "chosen" ]]; then
              VERSION="$PKG"; RELEASE=true
            else
              if [[ "$BASE" != "$PKG" ]]; then
                npm version "$BASE" --no-git-tag-version --no-workspaces-update --allow-same-version > /dev/null
              fi
              npm version "$KIND" --no-git-tag-version --no-workspaces-update > /dev/null
              VERSION=$(node -p "require('./package.json').version")
              git config user.name "github-actions[bot]"
              git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
              git commit -qam "chore(release): v$VERSION [skip ci]"
              for attempt in 1 2 3; do
                if git push --quiet origin HEAD:main; then break; fi
                if [[ $attempt == 3 ]]; then echo "::error::Couldn't push the version bump to main (is the branch protected?)."; exit 1; fi
                git pull --rebase --quiet origin main
              done
              RELEASE=true
            fi
            SHA=$(git rev-parse HEAD)
          else
            PKG=$(node -p "require('./package.json').version")
            VERSION="$PKG-dev.$GITHUB_RUN_NUMBER"; RELEASE=false
          fi

          CODE=$(node -e "const [a,b,c]='$VERSION'.split('-')[0].split('.').map(Number); console.log(a*1000000+b*1000+c)")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "release=$RELEASE" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "previous=$PREVIOUS" >> "$GITHUB_OUTPUT"
          echo "### Version $VERSION (release: $RELEASE, Android versionCode $CODE)" >> "$GITHUB_STEP_SUMMARY"

  # ------------------------------------------------------------------ checks
  test:
    name: Typecheck & test
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.version.outputs.sha }}
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: if [ -f package-lock.json ]; then npm ci; else npm install; fi
      - run: npm run typecheck
      - run: npm test

  # ------------------------------------------------------------------ web
  web:
    name: Web
    needs: [version, test]
    runs-on: ubuntu-latest
    env:
      VITE_APP_VERSION: ${{ needs.version.outputs.version }}
      # Relative paths: the zip works at any address and in any folder of a website.
      VITE_BASE: ./
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.version.outputs.sha }}
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Note when no server URL is configured
        if: env.VITE_SERVER_URL == ''
        run: echo "::notice::Repository variable VITE_SERVER_URL is not set. Builds play against bots offline; the player can enter a server address in Settings."
      - name: Install dependencies
        run: if [ -f package-lock.json ]; then npm ci; else npm install; fi
      - run: npm run build:web
      - name: Package the web build
        run: |
          cp tools/web-hosting.txt client/dist/HOSTING.txt
          mkdir -p out
          (cd client/dist && zip -qr "../../out/GridRush-${VITE_APP_VERSION}-Web.zip" .)
          ls -la out
      - uses: actions/upload-artifact@v4
        with:
          name: grid-rush-web
          path: out/*.zip
          if-no-files-found: error
          retention-days: 1

  # ------------------------------------------------------------------ android
  android:
    name: Android
    needs: [version, test]
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
      VITE_APP_VERSION: ${{ needs.version.outputs.version }}
      VITE_BASE: /
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.version.outputs.sha }}
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json
      # Capacitor 6 / Android Gradle Plugin 8.2 need Java 17 (the Android SDK is preinstalled on the runner).
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Check server URL
        run: |
          if [ -z "$VITE_SERVER_URL" ]; then
            echo "::notice::VITE_SERVER_URL is not set: the app plays vs bots offline and asks for a server address in Settings."
          fi
      - name: Install dependencies
        run: if [ -f package-lock.json ]; then npm ci; else npm install; fi
      - run: npm run build:web

      - name: Sync the Android project
        working-directory: client
        run: npx cap sync android

      - name: Set version
        working-directory: client/android
        run: |
          sed -i -E "s/versionCode [0-9]+/versionCode ${{ needs.version.outputs.code }}/" app/build.gradle
          sed -i -E "s/versionName \"[^\"]*\"/versionName \"$VERSION\"/" app/build.gradle
          grep -E "versionCode|versionName" app/build.gradle

      - name: Build debug APK
        working-directory: client/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      # Signed with Gradle's injected signing config (the same mechanism Android Studio uses),
      # so the outputs are app-release.apk / app-release.aab, signed. Unsigned files are never shipped.
      - name: Build signed release APK and AAB
        if: env.HAS_KEYSTORE == 'true'
        working-directory: client/android
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" | tr -d '\r\n ' | base64 --decode > "$RUNNER_TEMP/release.keystore"
          keytool -list -keystore "$RUNNER_TEMP/release.keystore" -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" > /dev/null \
            || { echo "::error::The keystore, its password or the key alias in the repository secrets is wrong."; exit 1; }
          ./gradlew assembleRelease bundleRelease --no-daemon \
            -Pandroid.injected.signing.store.file="$RUNNER_TEMP/release.keystore" \
            -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASSWORD"

      - name: Verify signatures
        if: env.HAS_KEYSTORE == 'true'
        run: |
          OUTPUTS=client/android/app/build/outputs
          APKSIGNER="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -n 1)apksigner"
          "$APKSIGNER" verify --verbose --print-certs "$OUTPUTS/apk/release/app-release.apk"
          jarsigner -verify "$OUTPUTS/bundle/release/app-release.aab" | tail -n 1

      - name: Collect outputs
        run: |
          mkdir -p out
          OUTPUTS=client/android/app/build/outputs
          cp "$OUTPUTS/apk/debug/app-debug.apk" "out/GridRush-$VERSION-Android-debug.apk"
          if [ "$HAS_KEYSTORE" = "true" ]; then
            cp "$OUTPUTS/apk/release/app-release.apk" "out/GridRush-$VERSION-Android.apk"
            cp "$OUTPUTS/bundle/release/app-release.aab" "out/GridRush-$VERSION-Android.aab"
          fi
          ls -la out
      - uses: actions/upload-artifact@v4
        with:
          name: grid-rush-android
          path: out/*
          if-no-files-found: error
          retention-days: 1

  # ------------------------------------------------------------------ release
  release:
    name: GitHub Release
    needs: [version, web, android]
    if: needs.version.outputs.release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
      PREVIOUS: ${{ needs.version.outputs.previous }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.version.outputs.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          pattern: grid-rush-*
      - name: Collect files and checksums
        run: |
          mkdir -p release
          # The Android app and the ready-to-host web build.
          cp artifacts/grid-rush-android/* release/
          cp artifacts/grid-rush-web/* release/
          (cd release && sha256sum * > SHA256SUMS.txt)
          ls -la release
      - name: Write release notes
        env:
          REPO: ${{ github.repository }}
          # The address the build actually uses (the repository variable, or empty).
          SERVER_URL: ${{ env.VITE_SERVER_URL }}
        run: |
          node tools/release-notes.mjs > release-notes.md
          # The changes since the previous release, from the commit messages.
          git fetch --quiet --tags origin
          node tools/changes.mjs "$PREVIOUS" --notes >> release-notes.md
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          target_commitish: ${{ needs.version.outputs.sha }}
          name: Grid Rush v${{ env.VERSION }}
          body_path: release-notes.md
          generate_release_notes: true
          make_latest: true
          files: release/*
